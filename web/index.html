<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__SITE_TITLE__</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">__SITE_TITLE__</div>
      <div class="pill" id="count">-</div>
      <div class="spacer"></div>
      <div class="pill" id="health">-</div>
      <div class="pill" id="freshness">loading…</div>
      <label class="toggle"><input type="checkbox" id="hide-dead" checked> Hide unavailable</label>
      <button class="link-btn" id="rescan" title="Test every channel again">Re-check</button>
    </header>

    <nav class="sidebar" id="cats"></nav>

    <div class="main">
      <section class="stage">
        <div class="video-box">
          <video id="video" controls playsinline autoplay></video>
          <div class="overlay" id="overlay"></div>
        </div>
        <div class="now">
          <h2 id="now-title">Nothing playing</h2>
          <div class="meta" id="now-meta"></div>
        </div>
      </section>

      <aside class="channels">
        <div class="search-row">
          <input id="search" type="search" placeholder="Search channels…" autocomplete="off">
        </div>
        <div class="list" id="list"></div>
      </aside>
    </div>
  </div>

  <script src="hls.min.js"></script>
  <script src="channels.js"></script>
  <script src="app.js"></script>
</body>
</html>
